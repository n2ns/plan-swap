name: Publish Extension

on:
  push:
    tags:
      - 'v*'

# Reading the repository is all the jobs need; the registries are reached with their own tokens
permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Check tag matches package.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # vscode:prepublish runs typecheck and build
      - name: Package extension
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix-package
          path: '*.vsix'
          retention-days: 7

  # The Windows code paths are only exercised on Windows; nothing is published unless they pass too
  test-windows:
    name: Test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

  # Both registries publish the same VSIX built above
  publish-marketplace:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, test-windows]
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: vsix-package

      - name: Publish to Marketplace
        run: npx --yes @vscode/vsce@4.0.0 publish --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  publish-openvsx:
    name: Publish to Open VSX
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, test-windows]
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: vsix-package

      - name: Publish to Open VSX
        run: npx --yes ovsx@1.2.0 publish *.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
